[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "humanfriendly-ng"
dynamic = ["version"]
description = "Human friendly output for text interfaces using Python"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [{ name = "Peter Odding", email = "peter@peterodding.com" }]
maintainers = [{ name = "marco8154" }]
requires-python = ">=3.10"
dependencies = [
    # For details about this conditional requirement please see
    # https://github.com/xolox/python-humanfriendly/pull/45.
    'pyreadline3; sys_platform == "win32"',
]
classifiers = [
    "Development Status :: 6 - Mature",
    "Environment :: Console",
    "Framework :: Sphinx :: Extension",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Natural Language :: English",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Communications",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Software Development",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: System :: Shells",
    "Topic :: System :: System Shells",
    "Topic :: System :: Systems Administration",
    "Topic :: Terminals",
    "Topic :: Text Processing :: General",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/marco8154/python-humanfriendly-ng"
Documentation = "https://humanfriendly.readthedocs.io"
Changelog = "https://github.com/marco8154/python-humanfriendly-ng/blob/master/CHANGELOG.rst"
"Original project" = "https://github.com/xolox/python-humanfriendly"

[project.scripts]
humanfriendly = "humanfriendly.cli:main"

[tool.hatch.version]
path = "humanfriendly/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["humanfriendly"]

[tool.hatch.build.targets.sdist]
include = [
    "/humanfriendly",
    "/docs",
    "/*.rst",
    "/*.txt",
    "/tox.ini",
]
